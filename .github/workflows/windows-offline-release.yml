name: Windows x64 offline release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Build pinned offline package
        shell: pwsh
        run: ./scripts/build-offline-windows.ps1
      - name: Smoke test extracted Windows package
        shell: pwsh
        run: ./scripts/smoke-offline-windows.ps1
      - name: Install and probe from extracted Windows package
        shell: pwsh
        env:
          X3UI_TEST_HOST: 117.55.224.148
          X3UI_TEST_NAME: x3ui-win-test
          X3UI_TEST_PANEL_PORT: "22055"
          X3UI_TEST_NODE_PORT: "18446"
          X3UI_TEST_SSH_PASSWORD: ${{ secrets.X3UI_TEST_SSH_PASSWORD }}
        run: ./scripts/e2e-offline-windows.ps1
      - name: Archive release source
        shell: pwsh
        run: git archive --format=zip --prefix=x3ui-local-installer-v1.4.0/ --output=dist/X3-UI-Installer-Source-v1.4.0.zip HEAD
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 `
            dist/X3-UI-Offline-Installer-Windows-x64-v1.4.0.zip `
            dist/X3-UI-Offline-Installer-Windows-x64-v1.4.0.zip.sha256 `
            dist/X3-UI-Installer-Source-v1.4.0.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "X3-UI Offline Installer v1.4.0 - Mac and Windows" `
            --notes-file packaging/RELEASE-NOTES-WINDOWS.md
